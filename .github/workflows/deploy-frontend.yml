name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_API_URL: https://api.sales.efcloud.tech/api
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      - name: SPA 404 fallback + CNAME
        run: |
          # 404.html "spa-github-pages": redirige preservando el path como
          # ?/<path>, así index.html lo desempaca en lugar de servir status 404
          # con la SPA. Ver script en frontend/index.html.
          cat > dist/404.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <title>SalesHub</title>
          <script>
            (function (l) {
              l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                '/?/' + l.pathname.slice(1).replace(/&/g, '~and~').replace(/\//g, '~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
              );
            })(window.location);
          </script>
          </head>
          <body></body>
          </html>
          HTML
          echo "sales.efcloud.tech" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
