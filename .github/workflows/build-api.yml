name: Build API image

# Arma la imagen del backend en GitHub (no en el droplet, que se quedaba sin memoria al compilar) y la
# publica en ghcr.io. En el droplet, Watchtower la baja sola y reinicia solo saleshub-api.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/build-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-api
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: PROJECT=SalesHub.Api
          push: true
          tags: |
            ghcr.io/ericfrick132/sales-hub-api:latest
            ghcr.io/ericfrick132/sales-hub-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
