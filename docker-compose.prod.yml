services:
  saleshub-api:
    build:
      context: ./backend
      args:
        PROJECT: SalesHub.Api
    image: sales-hub:latest
    container_name: saleshub-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      SALESHUB_RUN_WORKERS: "true"
      SALESHUB_AUTO_MIGRATE: "true"
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - /opt/saleshub/public/downloads:/app/wwwroot/downloads
    networks:
      - caddy
      - evolution
    # Permite que el container alcance un proxy corriendo en el HOST (ej. el túnel
    # SOCKS5 reverso de la compu de Eric, bindeado en 0.0.0.0:1080 del droplet).
    # Así Instagram__ProxyUrl puede ser socks5://host.docker.internal:1080 sin
    # hardcodear la IP del gateway de docker (que cambia si se recrea la red).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Los workers de IG corren acá y lanzan Chromium (Playwright), que solo ya usa
    # ~300-500MB por instancia. Con 450m el contenedor se OOM-killeaba al abrir el
    # navegador. El host tiene RAM de sobra (~2GB libres + swap), así que damos
    # headroom para 2-3 navegadores en simultáneo.
    mem_limit: 1500m
    mem_reservation: 400m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  caddy:
    external: true
    name: n8n-docker-caddy_default
  evolution:
    external: true
    name: evolution-api_evolution-network
